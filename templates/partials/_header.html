{% load static %}
<div class="topbar">
  <div class="container">
    <nav class="nav">
      <a class="brand" href="{% url 'home' %}">
        <img class="brand-logo" src="{% static 'img/rasel-escudo.webp' %}" alt="RaSel">
      </a>

      {# Toggle del menú mobile (checkbox-hack, sin JS) #}
      <input type="checkbox" id="nav-toggle" class="nav-toggle sr-only" aria-hidden="true">

      <div class="navlinks">
        <a class="navlink {% if request.resolver_match and request.resolver_match.app_name == 'shop' %}is-active{% endif %}"
          href="{% url 'shop:product_list' %}">
          Tienda
        </a>

        <a class="navlink {% if request.resolver_match and request.resolver_match.url_name == 'about' %}is-active{% endif %}"
          href="{% url 'about' %}">
          Quiénes Somos
        </a>

        <a class="navlink {% if request.resolver_match and request.resolver_match.url_name == 'contact' %}is-active{% endif %}"
          href="{% url 'contact' %}">
          Contacto
        </a>

        <form action="{% url 'shop:product_list' %}" method="get" class="search-form" role="search">
          <label for="q" class="sr-only">Buscar productos</label>
          <input id="q" class="search-input" type="search" name="q" value="{{ request.GET.q|default:'' }}"
            placeholder="Buscar" />
          <button class="btn btn-small" type="submit">
            <span class="icon">{% include "partials/icons/search.svg" %}</span>
            Buscar
          </button>
        </form>
      </div>

      <div class="nav-actions">
        <a href="{% url 'cart:detail' %}"
          class="pill pill-cart {% if request.resolver_match and request.resolver_match.app_name == 'cart' %}is-active{% endif %}"
          aria-label="Carrito">
          <span>Carrito</span>
          <span class="badge-num" aria-label="Items en carrito">{{ cart|length }}</span>
        </a>

        <label for="nav-toggle" class="nav-burger" aria-label="Abrir menú">
          <span class="icon nav-burger-open">{% include "partials/icons/menu.svg" %}</span>
          <span class="icon nav-burger-close">{% include "partials/icons/close.svg" %}</span>
        </label>
      </div>
    </nav>
  </div>
</div>
