{% load money %}
<div class="product-price-block">
  <div class="price-meta">Precio</div>
  <div class="price">
    {% if product.min_price_ars %}{{ product.min_price_ars|ars }}{% else %}—{% endif %}
  </div>
  {% if product.min_price_ars %}
    <div class="product-card-offline-price">
      <strong>{{ product.offline_price_ars|ars }}</strong>
      <span>con transferencia o efectivo</span>
    </div>
  {% endif %}
</div>
