{% extends "base.html" %}
{% load static %}

{% block title %}RaSel — Tienda{% endblock %}

{% block content %}
<div class="section-head">
  <h1 class="h2 section-title">Tienda</h1>
</div>

<div class="card">
  <div class="card-inner">
    <form method="get">
      <input type="text" name="q" value="{{ query|default:'' }}" placeholder="Buscar...">
      <button type="submit">Filtrar</button>
    </form>
  </div>
</div>

<div class="spacer"></div>

<div class="grid">
  {% for p in page_obj %}
  <div class="card product">
    <div class="product-body">
      <h5>{{ p.name }}</h5>
      <p>{{ p.short_description }}</p>
      <a href="{% url 'shop:product_detail' p.slug %}" class="btn">Ver</a>
    </div>
  </div>
  {% empty %}
  <p>No hay productos.</p>
  {% endfor %}
</div>
{% endblock %}
