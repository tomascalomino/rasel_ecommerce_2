{% extends "base.html" %}

{% block title %}Reintentar pago - RaSel{% endblock %}

{% block content %}
<div class="card confirm-card">
  <div class="card-inner">
    <h1 class="h1 page-intro">Mercado Pago no respondio</h1>
    <p class="muted">Tu stock sigue reservado por unos minutos. Podes reintentar de forma segura; no se generara un cobro duplicado.</p>
    <div class="spacer"></div>
    <form method="post" action="{% url 'payments:start' draft_id=draft.token %}">
      {% csrf_token %}
      <button class="btn btn-gold" type="submit">Reintentar Mercado Pago</button>
    </form>
    <div class="spacer"></div>
    <a class="btn" href="{% url 'shop:product_list' %}">Volver a la tienda</a>
  </div>
</div>
{% endblock %}
