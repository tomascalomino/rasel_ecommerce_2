services:
  - type: web
    name: rasel-ecommerce
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --chdir backend --workers 2 --timeout 60"
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SITE_URL
        value: "https://rasel-ecommerce.onrender.com"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rasel-db
          property: connectionString

databases:
  - name: rasel-db
    databaseName: rasel
    user: rasel
    plan: free
