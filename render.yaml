services:
  - type: web
    name: rasel-ecommerce
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    # NOTA: en plan free NO hay disco persistente. Las imágenes subidas por el
    # admin se pierden en cada deploy; sólo persisten las que están commiteadas
    # en el repo (media/products/*). Para subir imágenes desde el admin y que
    # persistan, mover MEDIA a un bucket externo (Cloudflare R2 / S3) o pasar a
    # un plan con disco.
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SITE_URL
        value: "https://rasel-ecommerce.onrender.com"
      # Sin disco en free: servimos la media commiteada en el repo (default de settings).
      - key: SERVE_MEDIA
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
      - key: SENTRY_ENVIRONMENT
        value: "production"
      # Credenciales MercadoPago de PRODUCCIÓN (APP_USR-...). Cargar a mano en el dashboard.
      - key: MP_ACCESS_TOKEN
        sync: false
      # Secret del webhook de MercadoPago: OBLIGATORIO en prod (valida la firma).
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      # DB externa (Neon/Supabase): pegar la connection string en el dashboard de Render.
      - key: DATABASE_URL
        sync: false
