services:
  - type: web
    name: rasel-ecommerce
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    preDeployCommand: "python backend/manage.py migrate --noinput"
    disk:
      name: media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: SITE_URL
        value: "https://rasel-ecommerce.onrender.com"
      - key: MEDIA_ROOT
        value: "/var/data/media"
      - key: SERVE_MEDIA
        value: "1"
      - key: PYTHON_VERSION
        value: "3.11"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      - key: DATABASE_URL
        fromDatabase:
          name: rasel-db
          property: connectionString

databases:
  - name: rasel-db
    databaseName: rasel
    user: rasel
    plan: free
