services:
  - type: web
    name: rasel-ecommerce
    runtime: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    # Producción usa Cloudflare R2 para la media cargada desde admin. Las
    # variables R2 se administran en el dashboard de Render y no se publican
    # en este archivo. Sin R2, la media local no persiste en el plan free.
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,rasel.ar,www.rasel.ar"
      - key: SITE_URL
        value: "https://rasel.ar"
      # Fallback para media local; con R2 configurado las imágenes de producto
      # se sirven desde el dominio público del bucket.
      - key: SERVE_MEDIA
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: LOG_LEVEL
        value: "INFO"
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.0"
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: MP_CHECKOUT_ENABLED
        value: "0"
      - key: MP_ENVIRONMENT
        value: "production"
      - key: MP_MAX_INSTALLMENTS
        value: "6"
      - key: MP_RESERVATION_MINUTES
        value: "30"
      - key: MP_PENDING_MAX_HOURS
        value: "48"
      # Credenciales MercadoPago de PRODUCCIÓN (APP_USR-...). Cargar a mano en el dashboard.
      - key: MP_ACCESS_TOKEN
        sync: false
      # Secret del webhook de MercadoPago: OBLIGATORIO en prod (valida la firma).
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_ALERT_EMAIL
        sync: false
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
      # DB externa (Neon/Supabase): pegar la connection string en el dashboard de Render.
      - key: DATABASE_URL
        sync: false
      # Email transaccional vía API HTTP de Brevo (Render free bloquea SMTP saliente).
      # Sin esta key los emails van al backend de consola y NO se entregan.
      # Crear la key en Brevo (SMTP & API → API Keys) y pegarla en el dashboard.
      - key: BREVO_API_KEY
        sync: false
      # El remitente debe estar verificado en Brevo (dominio o email).
      - key: DEFAULT_FROM_EMAIL
        value: "RaSel <no-reply@rasel.ar>"
      # Aviso de nuevas órdenes al dueño (opcional): email destino.
      - key: ORDER_NOTIFICATION_EMAIL
        sync: false

  - type: cron
    name: rasel-mp-reconcile
    runtime: python
    plan: starter
    branch: bundle_work
    schedule: "*/10 * * * *"
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python backend/manage.py reconcile_mp_payments --batch-size 100"
    envVars:
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: SITE_URL
        value: "https://rasel.ar"
      - key: ALLOWED_HOSTS
        value: "rasel.ar,www.rasel.ar"
      - key: DATABASE_URL
        sync: false
      - key: MP_CHECKOUT_ENABLED
        value: "0"
      - key: MP_ENVIRONMENT
        value: "production"
      - key: MP_MAX_INSTALLMENTS
        value: "6"
      - key: MP_RESERVATION_MINUTES
        value: "30"
      - key: MP_PENDING_MAX_HOURS
        value: "48"
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: PAYMENT_ALERT_EMAIL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "RaSel <no-reply@rasel.ar>"
      - key: DJANGO_SETTINGS_MODULE
        value: "config.settings"
