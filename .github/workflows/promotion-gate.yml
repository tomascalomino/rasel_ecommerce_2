name: Promotion gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rasel_test
          POSTGRES_USER: rasel_test
          POSTGRES_PASSWORD: local_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rasel_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://rasel_test:local_ci_only@localhost:5432/rasel_test
    steps:
      - name: Require bundle_work as source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "bundle_work" ] || [ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "Production promotions must use bundle_work -> main."
            exit 1
          fi

      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Django
        run: |
          python backend/manage.py check
          python backend/manage.py test config shop cart orders payments shipping analytics
