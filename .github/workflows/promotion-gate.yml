name: Promotion gate

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Require bundle_work as source
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          TARGET_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REF" != "bundle_work" ] || [ "$HEAD_REPOSITORY" != "$TARGET_REPOSITORY" ]; then
            echo "Production promotions must use bundle_work -> main."
            exit 1
          fi

      - name: Checkout candidate
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate Django
        run: |
          python backend/manage.py check
          python backend/manage.py test config shop cart orders payments shipping
