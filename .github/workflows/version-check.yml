name: Version check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  app-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test versioning checker
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_app_version.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          validate_range() {
            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "bundle_work" ]; then
              python scripts/check_app_version.py --range "$1" --allow-promotion-merge
            else
              python scripts/check_app_version.py --range "$1"
            fi
          }

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            validate_range "$AFTER"
          elif git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            validate_range "$BEFORE..$AFTER"
          else
            echo "Non-fast-forward updates are not allowed."
            exit 1
          fi
