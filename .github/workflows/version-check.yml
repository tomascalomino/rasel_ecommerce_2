name: Version check

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  app-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test versioning checker
        run: python -m unittest discover -s scripts -p "test_*.py"

      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        run: >-
          python scripts/check_app_version.py
          --range "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Validate pushed commits
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
          FORCED: ${{ github.event.forced }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            python scripts/check_app_version.py --range "$AFTER"
          elif git merge-base --is-ancestor "$BEFORE" "$AFTER"; then
            python scripts/check_app_version.py --range "$BEFORE..$AFTER"
          elif [ "$FORCED" = "true" ] && [ "$BRANCH" = "bundle_work" ]; then
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              git fetch --no-tags origin "$BEFORE"
            fi
            python scripts/check_app_version.py --sync "$BEFORE" "$AFTER"
          else
            echo "Non-fast-forward updates are only allowed for identical bundle_work post-squash syncs."
            exit 1
          fi
